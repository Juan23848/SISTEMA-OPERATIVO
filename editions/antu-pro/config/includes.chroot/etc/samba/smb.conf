#
# Configuración de Samba de Antü OS.
#
# Reemplaza al smb.conf genérico que trae el paquete (se copia después
# de instalar los paquetes, así que pisa el default).
#
# La carpeta compartida requiere una cuenta (no acceso de invitado). Dos
# motivos reales, encontrados en una revisión externa (Codex) y
# confirmados contra la documentación de Microsoft, no solo teoría:
# 1. Windows 10/11 actualizado **restringe el acceso de invitado por
#    política** desde hace varios años — un share "guest ok = yes" puede
#    directamente no dejar conectarse desde una PC Windows moderna sin
#    que el usuario reactive esa política a mano, algo que no tiene
#    sentido pedirle.
# 2. Escritura anónima con permisos 0777 significa que cualquiera con
#    acceso a la red (no solo la PC del usuario) puede modificar el
#    contenido compartido — mal default para algo que se instala solo.
#
# Por eso la carpeta queda configurada pero SIN uso hasta que el usuario
# la habilite (dos comandos, ver antu-compartir-configurar):
#   sudo usermod -aG antu-compartido "$USER"
#   sudo smbpasswd -a "$USER"
# La creación de esas credenciales pertenece al primer uso, no a la
# compilación de la ISO (todavía no existe el usuario en ese momento).
#
[global]
   workgroup = ANTU
   server string = %h - Antü OS
   security = user
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   panic action = /usr/share/samba/panic-action %d

[Compartido]
   comment = Carpeta compartida de Antü (necesita cuenta, ver antu-compartir-configurar)
   path = /srv/antu-compartido
   browsable = yes
   guest ok = no
   valid users = @antu-compartido
   read only = no
   create mask = 0664
   directory mask = 0775
