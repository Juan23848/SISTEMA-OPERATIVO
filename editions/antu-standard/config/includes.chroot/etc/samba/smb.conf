#
# Configuración de Samba de Antü OS.
#
# Reemplaza al smb.conf genérico que trae el paquete (se copia después
# de instalar los paquetes, así que pisa el default). Prioriza "enchufar
# y usar" antes que seguridad fina: una sola carpeta compartida de
# acceso libre, pensada para una red hogareña/de oficina de confianza,
# no para exponerse a internet.
#
# Compartir la carpeta personal de cada usuario (la opción [homes] de
# Samba) queda para más adelante: requiere que el usuario configure una
# contraseña de Samba aparte de su contraseña de Linux (smbpasswd), algo
# que no se puede resolver en el momento de compilar la ISO porque el
# usuario todavía no existe.
#
[global]
   workgroup = ANTU
   server string = %h - Antü OS
   security = user
   map to guest = Bad User
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   panic action = /usr/share/samba/panic-action %d

[Compartido]
   comment = Carpeta compartida de Antü
   path = /srv/antu-compartido
   browsable = yes
   guest ok = yes
   read only = no
   create mask = 0666
   directory mask = 0777
