name: Compilar ISO

# Manual a propósito: compilar una ISO completa baja paquetes de Debian
# de verdad y puede tardar bastante — no tiene sentido dispararlo en cada
# push. Se dispara a mano desde la pestaña Actions (o vía API) cuando se
# quiere confirmar que una edición realmente compila de punta a punta.
"on":
  workflow_dispatch:
    inputs:
      edition:
        description: "Edición a compilar"
        required: true
        default: antu-standard
        type: choice
        options:
          - antu-legacy
          - antu-standard
          - antu-pro

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Los runners de GitHub traen preinstalados varios SDKs/toolchains
      # (.NET, Android, Haskell, etc.) que no usamos para nada acá y que
      # dejan muy poco espacio libre por defecto — un build de live-build
      # con un escritorio completo (Cinnamon/XFCE/Plasma + LibreOffice +
      # Wine, etc.) necesita bastante más que eso. Se libera antes de
      # arrancar en vez de esperar a quedarnos sin disco a mitad de build.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/boost /usr/local/graalvm /usr/local/julia* \
            2>/dev/null || true
          docker image prune -af || true
          df -h /

      # docs/BUILD.md es explícito: hay que compilar con el live-build
      # real de Debian bookworm, no con el de Ubuntu (buscan los hooks en
      # rutas distintas — ver esa guía para el detalle). Los runners de
      # GitHub son Ubuntu, así que el build corre adentro de un
      # contenedor debian:bookworm. --privileged porque live-build hace
      # chroot + bind-mounts de /dev, /proc, /sys para instalar paquetes
      # dentro de la imagen que arma.
      - name: Compilar ${{ inputs.edition }} en un contenedor Debian bookworm
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:bookworm \
            bash -c '
              set -euo pipefail
              echo "==> Versión de Debian dentro del contenedor:"
              cat /etc/os-release
              apt-get update
              apt-get install -y live-build xorriso
              dpkg-query -W live-build
              ./scripts/build.sh "${{ inputs.edition }}"
            '

      - name: Ubicar la ISO generada
        id: find_iso
        run: |
          ISO_PATH=$(find "editions/${{ inputs.edition }}/build" -iname '*.iso' | head -n1)
          if [[ -z "$ISO_PATH" ]]; then
            echo "No se encontró ninguna ISO en editions/${{ inputs.edition }}/build/"
            exit 1
          fi
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO_PATH"

      - name: Subir la ISO como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.edition }}-iso
          path: ${{ steps.find_iso.outputs.iso_path }}
          retention-days: 14

  # Compilar sin errores no prueba que la ISO arranque de verdad — son
  # cosas distintas (ver docs/BUILD.md). Este job la bootea en QEMU de
  # verdad y va sacando capturas de la pantalla mientras arranca, mismo
  # método (captura real + inspección visual) que ya encontró bugs reales
  # en las sesiones Xvfb de Legacy/Standard/Pro. Job aparte para poder
  # reintentar solo esto sin tener que recompilar (~20 min) de nuevo.
  boot-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar la ISO compilada
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.edition }}-iso
          path: iso

      - name: Instalar QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 socat imagemagick tesseract-ocr

      # Los runners hospedados por GitHub tienen /dev/kvm, pero el
      # usuario "runner" no tiene permiso de acceso por defecto (queda en
      # el grupo "kvm", con modo 660) — confirmado en el primer intento
      # real: "Could not access KVM kernel module: Permission denied",
      # QEMU se caía al instante, antes de sacar ninguna captura. Sin
      # aceleración de hardware el boot sería muchísimo más lento
      # (emulación por software), así que en vez de resignarse a eso se
      # abre el permiso a mano — es un runner descartable, no hay nada
      # que proteger.
      - name: Chequear soporte de KVM
        id: kvm
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            echo "flag=-enable-kvm" >> "$GITHUB_OUTPUT"
            echo "Con aceleración KVM"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Sin KVM disponible: emulación por software, va a ser más lento"
          fi

      # Primer intento real (con KVM funcionando): las 20 capturas
      # resultaron idénticas — el OCR reveló por qué: la ISO arranca
      # bien y muestra el menú real de isolinux ("Press ENTER to boot"),
      # pero nada le mandaba esa tecla, así que se quedaba ahí para
      # siempre. Se agrega el sendkey para que el arranque avance de
      # verdad más allá del menú.
      - name: Arrancar la ISO, avanzar el menú y sacar capturas del boot
        id: boot
        run: |
          set -x
          ISO_PATH=$(find iso -iname '*.iso' | head -n1)
          mkdir -p boot-shots
          qemu-system-x86_64 \
            -m 3072 -smp 2 \
            ${{ steps.kvm.outputs.flag }} \
            -cdrom "$ISO_PATH" -boot d \
            -vga std -display none \
            -monitor unix:/tmp/qmon.sock,server,nowait \
            -no-reboot &
          QEMU_PID=$!

          sleep 10
          echo "screendump boot-shots/frame-00-menu.ppm" \
            | socat - UNIX-CONNECT:/tmp/qmon.sock || true

          sleep 2
          echo "sendkey ret" | socat - UNIX-CONNECT:/tmp/qmon.sock || true

          # Distinguir "terminó el loop porque ya sacamos las 24 capturas
          # previstas" de "QEMU se cerró solo antes de tiempo" (hallazgo
          # real de una revisión externa, ChatGPT/Codex: antes esto
          # siempre terminaba en éxito, incluso si el arranque se cortó a
          # los pocos segundos del menú — ver docs/ROADMAP.md, Fase 0,
          # para un caso real donde pasó justo eso).
          MURIO_TEMPRANO=0
          for i in $(seq 1 24); do
            sleep 30
            echo "screendump boot-shots/frame-$(printf '%02d' "$i").ppm" \
              | socat - UNIX-CONNECT:/tmp/qmon.sock || true
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU ya no está corriendo (se cerró solo o crasheó) en el frame $i"
              MURIO_TEMPRANO=1
              break
            fi
          done

          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true

          for f in boot-shots/*.ppm; do
            [[ -e "$f" ]] || continue
            convert "$f" "${f%.ppm}.png" && rm "$f"
          done
          ls -la boot-shots/

          echo "murio_temprano=$MURIO_TEMPRANO" >> "$GITHUB_OUTPUT"

      - name: Subir las capturas del boot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.edition }}-boot-screenshots
          path: boot-shots/
          retention-days: 14

      # Chequeo automático mínimo: que el arranque no se haya cortado
      # antes de tiempo, y que ninguna captura muestre el branding
      # genérico de Debian (regresión del fix documentado en
      # docs/ARCHITECTURE.md). No reemplaza una revisión manual con OCR
      # completo (ver docs/BUILD.md), pero evita que el job quede en
      # verde sin que nadie se dé cuenta si el arranque se rompe.
      - name: Verificar que el arranque no se cortó antes de tiempo
        if: always()
        run: |
          set -x
          if [[ "${{ steps.boot.outputs.murio_temprano }}" == "1" ]]; then
            echo "::error::QEMU se cerró antes de completar las capturas previstas -- el arranque no llegó a buen puerto. Revisar boot-shots/ (subido como artifact) con inspect-boot-screenshots.yml."
            exit 1
          fi

          TEXTO_ENCONTRADO=""
          for f in boot-shots/*.png; do
            [[ -e "$f" ]] || continue
            if tesseract "$f" - 2>/dev/null | grep -qiE 'Debian GNU|Boot menu'; then
              TEXTO_ENCONTRADO="$f"
              break
            fi
          done
          if [[ -n "$TEXTO_ENCONTRADO" ]]; then
            echo "::error::$TEXTO_ENCONTRADO muestra branding genérico de Debian ('Debian GNU'/'Boot menu') -- regresión del fix de branding del menú de arranque."
            exit 1
          fi
