name: Transcriptor para Windows

# Arma Transcriptor.exe en una máquina Windows de GitHub, lo prueba con una
# transcripción real (audio con voz -> Whisper -> .docx/.txt), confirma que
# la ventana abre, y lo publica como .zip en la release "transcriptor-windows"
# del repo, lista para bajar.
"on":
  push:
    paths:
      - "transcriptor/**"
      - ".github/workflows/transcriptor-windows.yml"
  workflow_dispatch:

concurrency:
  group: transcriptor-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # para publicar la release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: transcriptor
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el programa y PyInstaller
        run: |
          python -m pip install --upgrade pip
          # Pillow: PyInstaller lo usa para convertir el ícono .png a .ico.
          pip install ".[dev]" pyinstaller pillow

      - name: Pruebas automáticas (incluida la ventana)
        run: python -m pytest -q

      - name: Armar Transcriptor.exe
        run: python windows/construir.py

      # La prueba que importa: un audio real con voz, transcripto por el .exe
      # tal cual lo va a usar alguien que lo baja (modelo descargado de cero).
      # --cli usa el mismo motor que la ventana, sin necesitar clics.
      - name: Probar el .exe con un archivo de audio real
        run: |
          Invoke-WebRequest https://github.com/openai/whisper/raw/main/tests/jfk.flac -OutFile jfk.flac
          $p = Start-Process .\dist\Transcriptor\Transcriptor.exe -ArgumentList '--cli', 'jfk.flac', '-m', 'tiny', '-i', 'en', '-o', 'prueba', '-f', 'docx,txt' -Wait -PassThru
          Get-Content "$env:APPDATA\Transcriptor\registro.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Transcriptor.exe terminó con error $($p.ExitCode)" }
          Get-Content prueba\jfk.txt
          if (-not (Select-String -Path prueba\jfk.txt -Pattern "country" -Quiet)) { throw "La transcripción no tiene el texto esperado" }
          if ((Get-Item prueba\jfk.docx).Length -lt 5000) { throw "No se generó el .docx" }

      - name: Probar el .exe con un link (descarga con yt-dlp)
        run: |
          $p = Start-Process .\dist\Transcriptor\Transcriptor.exe -ArgumentList '--cli', 'https://github.com/openai/whisper/raw/main/tests/jfk.flac', '-m', 'tiny', '-i', 'en', '-o', 'prueba-link', '-f', 'txt' -Wait -PassThru
          Get-Content "$env:APPDATA\Transcriptor\registro.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Transcriptor.exe terminó con error $($p.ExitCode)" }
          if (-not (Select-String -Path prueba-link\*.txt -Pattern "country" -Quiet)) { throw "La transcripción del link no tiene el texto esperado" }

      # La máquina de GitHub no tiene placa NVIDIA: el proceso de prueba de la
      # placa tiene que responder "no" (código distinto de 0) sin colgarse.
      - name: Probar la detección de la placa de video
        timeout-minutes: 10
        run: |
          $p = Start-Process .\dist\Transcriptor\Transcriptor.exe -ArgumentList '--probar-gpu' -Wait -PassThru
          "Código de la prueba de placa: $($p.ExitCode)"
          if ($p.ExitCode -eq 0) { throw "Dijo que la placa de video funciona en una máquina sin placa" }

      # Que la ventana abra y siga abierta (si faltara algo del empaquetado,
      # como los temas o el arrastrar y soltar, se cerraría enseguida).
      - name: Probar que la ventana abre
        run: |
          $p = Start-Process .\dist\Transcriptor\Transcriptor.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Get-Content "$env:APPDATA\Transcriptor\registro.txt" -ErrorAction SilentlyContinue
            throw "La ventana se cerró sola (código $($p.ExitCode))"
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $pantalla = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $imagen = New-Object System.Drawing.Bitmap $pantalla.Width, $pantalla.Height
            [System.Drawing.Graphics]::FromImage($imagen).CopyFromScreen($pantalla.Location, [System.Drawing.Point]::Empty, $pantalla.Size)
            $imagen.Save("$pwd\captura-ventana.png")
          } catch { Write-Host "No se pudo capturar la pantalla: $_" }
          Stop-Process -Id $p.Id

      - name: Guardar la captura de la ventana
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-ventana
          path: transcriptor/captura-ventana.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Empaquetar el .zip
        # Se arma fuera del repo: Windows no distingue mayúsculas y una carpeta
        # "Transcriptor" acá chocaría con el código, que vive en "transcriptor".
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP "Transcriptor"
          New-Item -ItemType Directory $carpeta | Out-Null
          Copy-Item -Recurse dist\Transcriptor\* $carpeta
          Copy-Item windows\LEEME.txt $carpeta
          Compress-Archive -Path $carpeta -DestinationPath Transcriptor-Windows.zip
          "{0:N0} MB" -f ((Get-Item Transcriptor-Windows.zip).Length / 1MB)

      - name: Guardar el .zip en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-Windows
          path: transcriptor/Transcriptor-Windows.zip
          retention-days: 30

      # Una sola release que se reemplaza con cada versión nueva: el link para
      # bajarla es siempre el mismo y no hace falta tener cuenta de GitHub.
      - name: Publicar en la release "transcriptor-windows"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete transcriptor-windows --yes --cleanup-tag 2>$null
          $notas = "Programa para pasar video y audio a texto en Windows. Descargá Transcriptor-Windows.zip, descomprimilo y abrí Transcriptor.exe (instrucciones en LEEME.txt). Versión armada desde el commit $env:GITHUB_SHA."
          gh release create transcriptor-windows Transcriptor-Windows.zip --target $env:GITHUB_SHA --title "Transcriptor para Windows" --notes $notas --prerelease
