name: Inspeccionar paquete live-build (plantillas de arranque)

# Utilidad de investigación puntual: antes de intentar personalizar el
# menú/splash de isolinux-grub con la marca de Antü, hay que confirmar
# contra el live-build REAL de Debian bookworm (no contra uno de Ubuntu
# instalado en el sandbox de desarrollo — ya nos pasó factura una vez,
# ver docs/ARCHITECTURE.md) qué plantillas usa y si respeta overrides en
# config/bootloaders/<nombre>/.
"on":
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar live-build real de Debian bookworm y volcar plantillas
        run: |
          docker run --rm debian:bookworm bash -c '
            set -x
            apt-get update -qq
            apt-get install -y -qq live-build >/dev/null
            dpkg-query -W live-build

            echo "=========================================="
            echo "=== Todo lo que trae el paquete live-build (grep isolinux/syslinux/grub/binary) ==="
            echo "=========================================="
            dpkg -L live-build | grep -iE "isolinux|syslinux|grub|binary" || true

            echo "=========================================="
            echo "=== Contenido completo de bootloaders/isolinux ==="
            echo "=========================================="
            ls -la /usr/share/live/build/bootloaders/isolinux/ || true
            echo "--- isolinux.cfg ---"
            cat /usr/share/live/build/bootloaders/isolinux/isolinux.cfg || true

            echo "=========================================="
            echo "=== /usr/lib/live/build: todos los scripts que mencionan isolinux o binary ==="
            echo "=========================================="
            ls -la /usr/lib/live/build/ | grep -iE "isolinux|binary" || true
            ls /usr/lib/live/build/ || true

            echo "=========================================="
            echo "=== live-build (paquete live-build-doc si existe, o el binario lb) ==="
            echo "=========================================="
            which lb || true
            ls -la /usr/bin/lb* /usr/sbin/lb* 2>/dev/null || true
          '
