name: Inspeccionar paquete live-build (plantillas de arranque)

# Utilidad de investigación puntual: antes de intentar personalizar el
# menú/splash de isolinux-grub con la marca de Antü, hay que confirmar
# contra el live-build REAL de Debian bookworm (no contra uno de Ubuntu
# instalado en el sandbox de desarrollo — ya nos pasó factura una vez,
# ver docs/ARCHITECTURE.md) qué plantillas usa y si respeta overrides en
# config/bootloaders/<nombre>/.
"on":
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar mecanismo de hostname y ver splash.svg completo
        run: |
          docker run --rm debian:bookworm bash -c '
            set -x
            apt-get update -qq
            apt-get install -y -qq live-build >/dev/null

            echo "=========================================="
            echo "=== chroot_hostname (mecanismo real para el hostname) ==="
            echo "=========================================="
            cat /usr/lib/live/build/chroot_hostname

            echo "=========================================="
            echo "=== splash.svg completo (para confirmar los <text> con @PROJECT@ etc.) ==="
            echo "=========================================="
            cat /usr/share/live/build/bootloaders/syslinux_common/splash.svg
          '

      # Las 3 ediciones son "amd64" (ver docs/ARCHITECTURE.md, "Legacy
      # pasó de i386 a amd64"), y ninguna declara --bootloaders a mano
      # ni tiene overrides en config/bootloaders/grub-efi/. Antes de dar
      # por sentado que la ISO ya arranca en UEFI puro (hardware moderno
      # sin BIOS/CSM, ej. un i3 de 12va gen), hay que confirmar contra el
      # live-build real qué bootloader(s) usa por defecto para
      # --binary-images iso-hybrid en amd64/i386, y si ese default ya
      # incluye grub-efi o si hace falta declararlo.
      - name: Confirmar el default de --bootloaders para iso-hybrid en amd64/i386
        run: |
          docker run --rm debian:bookworm bash -c '
            set -x
            apt-get update -qq
            apt-get install -y -qq live-build >/dev/null

            echo "=========================================="
            echo "=== dpkg-query -W live-build (version real usada) ==="
            echo "=========================================="
            dpkg-query -W live-build

            echo "=========================================="
            echo "=== Donde live-build define el default de Bootloaders segun arquitectura ==="
            echo "=========================================="
            grep -rn "Bootloaders\|LB_BOOTLOADERS\|BOOTLOADERS=" /usr/lib/live/build/lb_config /usr/lib/live/build/config 2>/dev/null

            echo "=========================================="
            echo "=== lb config real (amd64, iso-hybrid, sin --bootloaders) -- que queda en config/binary ==="
            echo "=========================================="
            mkdir -p /work/amd64 && cd /work/amd64
            lb config noauto --mode debian --architectures amd64 \
              --distribution bookworm --binary-images iso-hybrid
            grep -i bootloader config/binary || echo "(sin BOOTLOADERS en config/binary)"

            echo "=========================================="
            echo "=== Carpetas de bootloaders que trae el paquete (grub-efi esta ahi?) ==="
            echo "=========================================="
            ls /usr/share/live/build/bootloaders/

            echo "=========================================="
            echo "=== lb config real (i386, iso-hybrid, sin --bootloaders) -- para comparar ==="
            echo "=========================================="
            mkdir -p /work/i386 && cd /work/i386
            lb config noauto --mode debian --architectures i386 \
              --distribution bookworm --binary-images iso-hybrid
            grep -i bootloader config/binary || echo "(sin BOOTLOADERS en config/binary)"
          '

      # Antes de asumir que un tema de GRUB "para sistema instalado" (ej.
      # vinceliuice/grub2-themes, que edita /etc/default/grub + corre
      # grub-mkconfig) sirve para el menú de una ISO viva: el menú real
      # que vimos por OCR bajo UEFI ("Live system (amd64)", "Start
      # installer", "Utilities...") es texto propio de live-build/d-i,
      # no lo que grub-mkconfig generaría en un sistema instalado normal.
      # Hay que confirmar de dónde sale ese texto y si existe algún
      # mecanismo de tema/override antes de intentar nada -- mismo
      # criterio que ya se usó para encontrar _PROJECT en binary_syslinux.
      - name: Buscar de dónde sale el menú de grub-efi para la ISO viva (¿admite tema?)
        run: |
          docker run --rm debian:bookworm bash -c '
            set -x
            apt-get update -qq
            apt-get install -y -qq live-build >/dev/null

            echo "=========================================="
            echo "=== Scripts de live-build relacionados con grub ==="
            echo "=========================================="
            ls /usr/lib/live/build/ | grep -i grub

            echo "=========================================="
            echo "=== Qué script contiene el texto real del menú (\"Live system\") ==="
            echo "=========================================="
            grep -rl "Live system" /usr/lib/live/build/ 2>/dev/null

            echo "=========================================="
            echo "=== binary_grub_cfg completo (el candidato real, no build ni binary_grub-efi) ==="
            echo "=========================================="
            cat /usr/lib/live/build/binary_grub_cfg

            echo "=========================================="
            echo "=== Busca mención a THEME/grub-mkconfig/update-grub/config/bootloaders en ese script ==="
            echo "=========================================="
            grep -inE "theme|grub-mkconfig|update-grub|config/bootloaders|config/grub" /usr/lib/live/build/binary_grub_cfg || echo "(sin mención)"
          '
