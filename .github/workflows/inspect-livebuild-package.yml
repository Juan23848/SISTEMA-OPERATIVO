name: Inspeccionar paquete live-build (plantillas de arranque)

# Utilidad de investigación puntual: antes de intentar personalizar el
# menú/splash de isolinux-grub con la marca de Antü, hay que confirmar
# contra el live-build REAL de Debian bookworm (no contra uno de Ubuntu
# instalado en el sandbox de desarrollo — ya nos pasó factura una vez,
# ver docs/ARCHITECTURE.md) qué plantillas usa y si respeta overrides en
# config/bootloaders/<nombre>/.
"on":
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar live-build real de Debian bookworm y volcar plantillas
        run: |
          docker run --rm debian:bookworm bash -c '
            set -x
            apt-get update -qq
            apt-get install -y -qq live-build >/dev/null

            echo "=========================================="
            echo "=== syslinux_common/menu.cfg ==="
            echo "=========================================="
            cat /usr/share/live/build/bootloaders/syslinux_common/menu.cfg

            echo "=========================================="
            echo "=== syslinux_common/stdmenu.cfg ==="
            echo "=========================================="
            cat /usr/share/live/build/bootloaders/syslinux_common/stdmenu.cfg

            echo "=========================================="
            echo "=== syslinux_common/live.cfg.in ==="
            echo "=========================================="
            cat /usr/share/live/build/bootloaders/syslinux_common/live.cfg.in

            echo "=========================================="
            echo "=== syslinux_common/splash.svg (primeras 40 líneas) ==="
            echo "=========================================="
            head -40 /usr/share/live/build/bootloaders/syslinux_common/splash.svg

            echo "=========================================="
            echo "=== binary_syslinux: overrides, splash, variables sustituidas ==="
            echo "=========================================="
            cat /usr/lib/live/build/binary_syslinux
          '
