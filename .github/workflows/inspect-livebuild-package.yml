name: Inspeccionar paquete live-build (plantillas de arranque)

# Utilidad de investigación puntual: antes de intentar personalizar el
# menú/splash de isolinux-grub con la marca de Antü, hay que confirmar
# contra el live-build REAL de Debian bookworm (no contra uno de Ubuntu
# instalado en el sandbox de desarrollo — ya nos pasó factura una vez,
# ver docs/ARCHITECTURE.md) qué plantillas usa y si respeta overrides en
# config/bootloaders/<nombre>/.
"on":
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar de dónde sale el banner de texto del menú
        run: |
          docker run --rm debian:bookworm bash -c '
            set -x
            apt-get update -qq
            apt-get install -y -qq live-build debian-cd apt-file >/dev/null 2>&1 || apt-get install -y -qq live-build >/dev/null

            echo "=========================================="
            echo "=== grep -rl \"Built:\" en todo el filesystem (fuente real del banner) ==="
            echo "=========================================="
            grep -rl "Built:" /usr/share/live/build/ /usr/lib/live/build/ 2>/dev/null || echo "(no está en live-build)"
            grep -rl "Built:" /usr/share/ /usr/lib/ --include="*.cfg*" --include="*.txt*" --include="*.in" 2>/dev/null | head -20

            echo "=========================================="
            echo "=== grep -rl \"live-boot:\" (otra parte distintiva del mismo banner) ==="
            echo "=========================================="
            grep -rl "live-boot:" / --include="*.cfg*" --include="*.txt*" --include="*.in" 2>/dev/null | grep -v "^/proc" | head -20

            echo "=========================================="
            echo "=== Contenido completo real de syslinux_common (por si dpkg -L no listaba todo) ==="
            echo "=========================================="
            find /usr/share/live/build/bootloaders/ -type f | sort
            find /usr/share/live/build/bootloaders/ -type l -exec ls -la {} \;

            echo "=========================================="
            echo "=== Scripts binary_debian-installer / installer_* (por si el banner viene de ahí) ==="
            echo "=========================================="
            grep -l "Built:\|live-boot:" /usr/lib/live/build/installer* /usr/lib/live/build/binary_debian-installer 2>/dev/null || true
            ls -la /usr/lib/live/build/ | grep -i install
          '
