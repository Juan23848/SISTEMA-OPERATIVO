<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#123A6B"/>
      <stop offset="55%" stop-color="#0A1730"/>
      <stop offset="100%" stop-color="#04070D"/>
    </radialGradient>
    <linearGradient id="peakGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F2F9FF"/>
      <stop offset="45%" stop-color="#5AD8FF"/>
      <stop offset="100%" stop-color="#1E6FEB"/>
    </linearGradient>
    <linearGradient id="horizonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FEB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BFEFFF"/>
      <stop offset="100%" stop-color="#1E6FEB" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Linea de horizonte, brillo que emerge detras del arco -->
  <path d="M 96 336 C 176 300, 336 300, 416 336"
        fill="none" stroke="url(#horizonGradient)" stroke-width="10"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Arco / "A": dos trazos que convergen en un pico, como un rayo de luz -->
  <path d="M 256 112 L 356 372 L 300 372 L 256 248 L 212 372 L 156 372 Z"
        fill="url(#peakGradient)"/>
</svg>
