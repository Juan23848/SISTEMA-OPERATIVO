<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160">
  <defs>
    <radialGradient id="bgGlowWordmark" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#123A6B"/>
      <stop offset="60%" stop-color="#0A1730"/>
      <stop offset="100%" stop-color="#04070D"/>
    </radialGradient>
    <linearGradient id="peakGradientWordmark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F2F9FF"/>
      <stop offset="45%" stop-color="#5AD8FF"/>
      <stop offset="100%" stop-color="#1E6FEB"/>
    </linearGradient>
    <linearGradient id="horizonGradientWordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FEB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BFEFFF"/>
      <stop offset="100%" stop-color="#1E6FEB" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowWordmark" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
