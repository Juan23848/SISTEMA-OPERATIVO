<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16294A"/>
      <stop offset="100%" stop-color="#050B16"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E4E82"/>
      <stop offset="45%" stop-color="#152B4D"/>
      <stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5AD8FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#BFEFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5AD8FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="tabGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFEFFF"/>
      <stop offset="100%" stop-color="#5AD8FF"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E6F5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000107" flood-opacity="0.55"/>
    </filter>
    <filter id="glowBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="paperShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000107" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Hojas asomando: dibujadas primero para que el cuerpo de la carpeta
       tape la mitad de abajo y solo se vean "saliendo" arriba. -->
  <g filter="url(#paperShadow)">
    <rect x="112" y="30" width="68" height="92" rx="4" fill="url(#paperGrad)" transform="rotate(6 146 76)"/>
    <rect x="98" y="26" width="68" height="94" rx="4" fill="url(#paperGrad)" transform="rotate(-4 132 73)"/>
    <g transform="rotate(1 128 72)">
      <rect x="94" y="24" width="68" height="94" rx="4" fill="#F2F9FF"/>
      <rect x="106" y="40" width="44" height="4" rx="2" fill="#9CC6F2"/>
      <rect x="106" y="50" width="36" height="4" rx="2" fill="#C7DCF2"/>
      <rect x="106" y="60" width="40" height="4" rx="2" fill="#C7DCF2"/>
      <rect x="106" y="34" width="24" height="4" rx="2" fill="#5AD8FF"/>
    </g>
  </g>

  <!-- Panel trasero con pestaña -->
  <path d="M 22 58
           L 92 58
           L 108 80
           L 232 80
           Q 240 80 240 88
           L 240 206
           Q 240 216 230 216
           L 30 216
           Q 20 216 20 206
           L 20 68
           Q 20 58 22 58 Z"
        fill="url(#backGrad)" filter="url(#softShadow)"/>

  <!-- Franja celeste en el borde de la pestaña: acento de marca, visible
       incluso a tamaño chico. -->
  <rect x="22" y="58" width="70" height="8" rx="3" fill="url(#tabGlow)"/>

  <!-- Solapa delantera (da la sensacion de volumen) -->
  <path d="M 18 104
           L 238 104
           L 227 208
           Q 226 218 216 218
           L 40 218
           Q 30 218 29 208
           Z"
        fill="url(#flapGrad)"/>

  <!-- Brillo/linea de luz en el borde superior de la solapa -->
  <path d="M 24 105 L 232 105" stroke="url(#rimGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glowBlur)"/>
  <path d="M 24 105 L 232 105" stroke="url(#rimGlow)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Realce (highlight) diagonal -->
  <path d="M 30 112 Q 80 100 140 108 L 132 122 Q 78 115 32 124 Z" fill="#9CC6F2" opacity="0.25"/>
</svg>
