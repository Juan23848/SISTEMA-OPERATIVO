<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1730"/>
      <stop offset="18%" stop-color="#2E4E82"/>
      <stop offset="45%" stop-color="#16294A"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A5C92"/>
      <stop offset="100%" stop-color="#0E1E38"/>
    </linearGradient>
    <linearGradient id="rimAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5AD8FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#BFEFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5AD8FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tabGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFEFFF"/>
      <stop offset="100%" stop-color="#5AD8FF"/>
    </linearGradient>
    <radialGradient id="insideDark" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#02030A"/>
      <stop offset="100%" stop-color="#050B16"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000107" flood-opacity="0.55"/>
    </filter>
    <filter id="glowBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Cuerpo de la papelera: trapezoide (mas ancho arriba, angosto abajo) -->
  <path d="M 82 96
           L 174 96
           L 162 208
           Q 161 216 152 216
           L 104 216
           Q 95 216 94 208
           Z"
        fill="url(#binGrad)" filter="url(#softShadow)"/>

  <!-- Nervaduras verticales (textura metalica corrugada) -->
  <g stroke="#04070D" stroke-width="2" opacity="0.5">
    <line x1="104" y1="104" x2="98" y2="208"/>
    <line x1="128" y1="104" x2="126" y2="210"/>
    <line x1="152" y1="104" x2="158" y2="208"/>
  </g>

  <!-- Interior (oscuro, vacio) -->
  <path d="M 88 96 L 168 96 L 163 112 L 93 112 Z" fill="url(#insideDark)"/>

  <!-- Borde/reborde superior -->
  <rect x="76" y="86" width="104" height="16" rx="6" fill="url(#rimGrad)"/>

  <!-- Franja celeste solida en el reborde: acento de marca, visible
       incluso a tamaño chico (misma tecnica que la pestaña de la carpeta). -->
  <rect x="80" y="88" width="96" height="6" rx="3" fill="url(#tabGlow)"/>

  <!-- Realce (highlight) a la izquierda, como reflejo de luz sobre metal -->
  <path d="M 92 108 Q 88 150 96 200" stroke="#9CC6F2" stroke-width="5" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>
</svg>
