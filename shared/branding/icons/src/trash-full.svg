<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E93AE"/>
      <stop offset="12%" stop-color="#F0F6FC"/>
      <stop offset="30%" stop-color="#C7D6E8"/>
      <stop offset="65%" stop-color="#93A8C2"/>
      <stop offset="100%" stop-color="#5C7192"/>
    </linearGradient>
    <linearGradient id="rimTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#DCE7F4"/>
      <stop offset="100%" stop-color="#9FB2CC"/>
    </linearGradient>
    <linearGradient id="tabGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5AD8FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#EAFBFF"/>
      <stop offset="100%" stop-color="#5AD8FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="baseShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E6285"/>
      <stop offset="50%" stop-color="#8497B4"/>
      <stop offset="100%" stop-color="#3E5074"/>
    </linearGradient>
    <linearGradient id="paperBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E6F5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020818" flood-opacity="0.45"/>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Glow celeste debajo: señal de "tiene contenido" -->
  <ellipse cx="128" cy="216" rx="46" ry="10" fill="#5AD8FF" opacity="0.4" filter="url(#glowSoft)"/>

  <!-- Cuerpo tronco-conico -->
  <path d="M 76 96
           C 74 140, 78 178, 90 206
           A 38 9 0 0 0 166 206
           C 178 178, 182 140, 180 96
           A 52 15 0 0 1 76 96 Z"
        fill="url(#binGrad)" filter="url(#softShadow)"/>

  <g stroke="#5C7192" stroke-width="2.2" opacity="0.5" fill="none">
    <path d="M 100 100 C 96 140, 97 178, 101 204"/>
    <path d="M 128 104 C 126 144, 126 180, 127 206"/>
    <path d="M 156 100 C 160 140, 159 178, 155 204"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.1" opacity="0.45" fill="none">
    <path d="M 110 101 C 106 142, 107 179, 111 205"/>
    <path d="M 146 101 C 150 142, 149 179, 145 205"/>
  </g>

  <ellipse cx="128" cy="206" rx="38" ry="9" fill="url(#baseShade)"/>

  <!-- Papeles desbordando: bien metidos hacia abajo (llegan hasta
       y~106-113) para que el aro y el agujero, dibujados despues, los
       tapen de verdad en la parte de abajo. Sin este solape se ve un
       hueco y el papel queda "flotando" arriba de la papelera. -->
  <g stroke="#9CB6D6" stroke-width="1.2">
    <path d="M 90 96 Q 84 82 97 74 Q 108 66 118 76 Q 124 65 135 72 Q 130 85 119 89 Q 124 100 109 102 Q 96 106 90 96 Z" fill="url(#paperBall)"/>
    <path d="M 122 86 Q 118 71 133 65 Q 148 58 156 71 Q 165 67 169 78 Q 163 91 150 90 Q 152 103 137 104 Q 124 104 122 86 Z" fill="#FFFFFF"/>
    <path d="M 150 97 Q 148 84 161 80 Q 174 76 178 89 Q 182 100 171 106 Q 160 113 150 106 Q 145 102 150 97 Z" fill="url(#paperBall)"/>
  </g>
  <path d="M 100 83 L 108 90 M 137 76 L 130 85 M 161 89 L 170 96" stroke="#7A93B8" stroke-width="1.5" opacity="0.7" fill="none"/>

  <!-- Boca de la papelera -->
  <ellipse cx="128" cy="94" rx="52" ry="15" fill="url(#rimTop)"/>
  <ellipse cx="128" cy="95.5" rx="43" ry="11" fill="#2A3B58"/>

  <path d="M 84 100 A 46 12 0 0 0 172 100" fill="none" stroke="url(#tabGlow)" stroke-width="4.5" stroke-linecap="round"/>

  <ellipse cx="128" cy="222" rx="48" ry="8" fill="#020818" opacity="0.3"/>
</svg>
