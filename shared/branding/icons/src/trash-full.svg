<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E93AE"/>
      <stop offset="12%" stop-color="#F0F6FC"/>
      <stop offset="30%" stop-color="#C7D6E8"/>
      <stop offset="65%" stop-color="#93A8C2"/>
      <stop offset="100%" stop-color="#5C7192"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#AEC0D8"/>
    </linearGradient>
    <linearGradient id="tabGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAFBFF"/>
      <stop offset="100%" stop-color="#5AD8FF"/>
    </linearGradient>
    <linearGradient id="paperBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E6F5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020818" flood-opacity="0.45"/>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Glow celeste debajo: señal de "tiene contenido" -->
  <ellipse cx="128" cy="214" rx="46" ry="10" fill="#5AD8FF" opacity="0.4" filter="url(#glowSoft)"/>

  <!-- Cuerpo -->
  <path d="M 82 96
           L 174 96
           L 162 208
           Q 161 216 152 216
           L 104 216
           Q 95 216 94 208
           Z"
        fill="url(#binGrad)" filter="url(#softShadow)"/>

  <g stroke="#5C7192" stroke-width="2.5" opacity="0.55">
    <line x1="104" y1="104" x2="98" y2="208"/>
    <line x1="128" y1="104" x2="126" y2="210"/>
    <line x1="152" y1="104" x2="158" y2="208"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.5">
    <line x1="112" y1="104" x2="107" y2="208"/>
    <line x1="140" y1="104" x2="142" y2="209"/>
  </g>

  <!-- Papeles desbordando -->
  <g>
    <path d="M 90 78 Q 84 64 97 56 Q 108 48 118 58 Q 124 47 135 54 Q 130 67 119 71 Q 124 82 109 84 Q 96 88 90 78 Z" fill="url(#paperBall)"/>
    <path d="M 122 68 Q 118 53 133 47 Q 148 40 156 53 Q 165 49 169 60 Q 163 73 150 72 Q 152 85 137 86 Q 124 86 122 68 Z" fill="#FFFFFF"/>
    <path d="M 150 79 Q 148 66 161 62 Q 174 58 178 71 Q 182 82 171 88 Q 160 95 150 88 Q 145 84 150 79 Z" fill="url(#paperBall)"/>
    <path d="M 100 65 L 108 72 M 137 58 L 130 67 M 161 71 L 170 78" stroke="#9CB6D6" stroke-width="1.5" opacity="0.6" fill="none"/>
  </g>

  <!-- Reborde -->
  <rect x="76" y="86" width="104" height="16" rx="6" fill="url(#rimGrad)"/>
  <rect x="80" y="88" width="96" height="6" rx="3" fill="url(#tabGlow)"/>

  <ellipse cx="102" cy="130" rx="8" ry="30" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="128" cy="220" rx="46" ry="8" fill="#020818" opacity="0.3"/>
</svg>
